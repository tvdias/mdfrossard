# ──────────────────────────────────────────────────────────────────────────
# Cloudflare Worker (modelo Static Assets, não Pages).
#
# • main          → entry point do Worker. Roteia /api/* p/ handlers JS
#                   e delega o restante a env.ASSETS (estático em ./public).
# • [assets]      → diretório dos arquivos estáticos gerados pelo Eleventy.
#   • binding     → expõe env.ASSETS dentro do Worker (env.ASSETS.fetch).
#   • not_found_handling → "404-page" serve /404.html para rotas inexistentes
#                          mantendo SEO (resposta 404 real).
#   • run_worker_first → SEM ISSO, o Cloudflare intercepta a requisição ANTES
#                        do Worker: se não achar um arquivo estático com esse
#                        caminho exato, serve o 404-page direto e o worker.js
#                        nunca roda. Resultado real observado: as URLs antigas
#                        redirecionadas em `legacyRedirects` (worker.js) e o
#                        tratamento de `?nonamp=1` / `/index.html` (seção 3)
#                        estavam retornando 404 puro em vez do 301 esperado.
#                        `run_worker_first = true` força o Worker a rodar
#                        SEMPRE primeiro, restaurando o comportamento descrito
#                        no comentário de worker.js ("Roteia /api/*... delega
#                        o restante a env.ASSETS"). Custo é desprezível: CPU
#                        time medido no dashboard é ~0,4-0,5ms por invocação.
#
# IMPORTANTE: este projeto NÃO usa Cloudflare Pages. A pasta functions/ é
# convenção exclusiva de Pages e foi removida — toda a lógica de backend
# vive em src/worker.js + src/api/*.
# ──────────────────────────────────────────────────────────────────────────

name = "mdfrossard"
main = "src/worker.js"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://mdfrossard.com.br"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true